name: Atualizar estatísticas do README

on:
  # gera os cards e testa os serviços externos a cada 6 h, e também manualmente
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Para incluir contribuições privadas nos números, crie o secret STATS_TOKEN
      # com um token pessoal (escopo read:user + repo). Sem ele, usa o token padrão.
      - name: Gerar cards (stats, linguagens, atividade)
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gerar_cards.py

      - name: Testar cards e reescrever seção
        run: python .github/scripts/atualizar_estatisticas.py

      - name: Commit se mudou
        run: |
          git add README.md assets/stats
          if git diff --cached --quiet; then
            echo "Nenhuma mudança."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza cards de estatísticas"
          git push
