name: Regenerar imagens do perfil

on:
  push:
    branches: [main, "chatgpt/**", "claude/**"]
    paths:
      - ".github/scripts/gerar_perfil.py"
      - ".github/scripts/legendar_carrosseis_en.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install --disable-pip-version-check fonttools pillow

      - name: Gerar paineis e cartoes
        run: python .github/scripts/gerar_perfil.py

      - name: Legendas em ingles nos carrosseis
        run: python .github/scripts/legendar_carrosseis_en.py

      - name: Validar as imagens referenciadas
        run: python .github/scripts/validar_readme.py

      - name: Publicar imagens na mesma branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/perfil/ assets/projetos/
          if ! git diff --cached --quiet; then
            git commit -m "assets: regenerar perfil e carrosseis em ingles"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
