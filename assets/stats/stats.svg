<svg xmlns="http://www.w3.org/2000/svg" width="467" height="195" viewBox="0 0 467 195" role="img" aria-label="Estatísticas do GitHub de André Ruperto">
  <title>Estatísticas do GitHub de André Ruperto</title>
  <style>
    .titulo { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #abd200; }
    .texto  { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #68b587; }
    .valor  { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #abd200; }
    .menor  { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #68b587; }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="466" height="194" fill="#0a0f0b" stroke="#e4e2e2" stroke-opacity="0.8"/>
  <text x="25" y="35" class="titulo">Estatísticas do GitHub de André Ruperto</text>
  <circle cx="31" cy="65" r="4" fill="#b7d364"/>
  <text x="50" y="70" class="texto">Estrelas recebidas:</text>
  <text x="245" y="70" class="valor">12</text>
  <circle cx="31" cy="90" r="4" fill="#b7d364"/>
  <text x="50" y="95" class="texto">Commits em 2026:</text>
  <text x="245" y="95" class="valor">3.019</text>
  <circle cx="31" cy="115" r="4" fill="#b7d364"/>
  <text x="50" y="120" class="texto">Pull requests:</text>
  <text x="245" y="120" class="valor">41</text>
  <circle cx="31" cy="140" r="4" fill="#b7d364"/>
  <text x="50" y="145" class="texto">Issues:</text>
  <text x="245" y="145" class="valor">2</text>
  <circle cx="31" cy="165" r="4" fill="#b7d364"/>
  <text x="50" y="170" class="texto">Contribuiu em (repos):</text>
  <text x="245" y="170" class="valor">4</text>
  <circle cx="370" cy="110" r="45" fill="none" stroke="#abd200" stroke-width="6"/>
  <text x="370" y="116" text-anchor="middle" class="titulo">3.040</text>
  <text x="370" y="178" text-anchor="middle" class="menor">contribuições no ano</text>
</svg>
