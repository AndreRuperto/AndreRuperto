<svg xmlns="http://www.w3.org/2000/svg" width="395" height="195" viewBox="0 0 395 195" role="img" aria-label="Linguagens mais usadas por André Ruperto">
  <title>Linguagens mais usadas por André Ruperto</title>
  <style>
    .titulo { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #abd200; }
    .texto  { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #68b587; }
    .valor  { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #abd200; }
    .grande { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #abd200; }
    .menor  { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #68b587; }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="394" height="194" fill="#0a0f0b" stroke="#e4e2e2" stroke-opacity="0.8"/>
  <text x="25" y="35" class="titulo">Linguagens mais usadas</text>
  <mask id="barra"><rect x="25" y="60" width="345" height="8" rx="4" fill="white"/></mask>
  <g mask="url(#barra)">
    <rect x="25.00" y="60" width="141.10" height="8" fill="#e34c26"/>
    <rect x="166.10" y="60" width="95.52" height="8" fill="#3178c6"/>
    <rect x="261.62" y="60" width="70.57" height="8" fill="#f1e05a"/>
    <rect x="332.19" y="60" width="27.05" height="8" fill="#3572A5"/>
    <rect x="359.24" y="60" width="9.10" height="8" fill="#663399"/>
    <rect x="368.35" y="60" width="1.65" height="8" fill="#DA5B0B"/>
  </g>
  <circle cx="31.0" cy="100" r="5" fill="#e34c26"/>
  <text x="44.0" y="105" class="texto">HTML</text>
  <text x="188.5" y="105" text-anchor="end" class="menor">40,9%</text>
  <circle cx="203.5" cy="100" r="5" fill="#3178c6"/>
  <text x="216.5" y="105" class="texto">TypeScript</text>
  <text x="361.0" y="105" text-anchor="end" class="menor">27,7%</text>
  <circle cx="31.0" cy="130" r="5" fill="#f1e05a"/>
  <text x="44.0" y="135" class="texto">JavaScript</text>
  <text x="188.5" y="135" text-anchor="end" class="menor">20,5%</text>
  <circle cx="203.5" cy="130" r="5" fill="#3572A5"/>
  <text x="216.5" y="135" class="texto">Python</text>
  <text x="361.0" y="135" text-anchor="end" class="menor">7,8%</text>
  <circle cx="31.0" cy="160" r="5" fill="#663399"/>
  <text x="44.0" y="165" class="texto">CSS</text>
  <text x="188.5" y="165" text-anchor="end" class="menor">2,6%</text>
  <circle cx="203.5" cy="160" r="5" fill="#DA5B0B"/>
