<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Resumo do GitHub de André Ruperto">
  <title>Resumo do GitHub de André Ruperto</title>
  <style>
    .titulo { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #abd200; }
    .texto  { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #68b587; }
    .valor  { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #abd200; }
    .grande { font: 700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #abd200; }
    .menor  { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #68b587; }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="494" height="194" fill="#0a0f0b" stroke="#e4e2e2" stroke-opacity="0.8"/>
  <text x="25" y="35" class="titulo">Resumo do GitHub de André Ruperto</text>
  <circle cx="31" cy="67" r="4" fill="#b7d364"/>
  <text x="45" y="72" class="texto">Contribuições totais</text>
  <text x="300" y="72" text-anchor="end" class="valor">5.539</text>
  <circle cx="31" cy="92" r="4" fill="#b7d364"/>
  <text x="45" y="97" class="texto">Commits em 2026</text>
  <text x="300" y="97" text-anchor="end" class="valor">4.080</text>
  <circle cx="31" cy="117" r="4" fill="#b7d364"/>
  <text x="45" y="122" class="texto">Pull requests</text>
  <text x="300" y="122" text-anchor="end" class="valor">133</text>
  <circle cx="31" cy="142" r="4" fill="#b7d364"/>
  <text x="45" y="147" class="texto">Estrelas recebidas</text>
  <text x="300" y="147" text-anchor="end" class="valor">12</text>
  <circle cx="31" cy="167" r="4" fill="#b7d364"/>
  <text x="45" y="172" class="texto">Recorde de sequência</text>
  <text x="300" y="172" text-anchor="end" class="valor">48 dias</text>
  <line x1="330" x2="330" y1="55" y2="175" stroke="#1f2a21" stroke-width="2"/>
  <circle cx="400" cy="100" r="42" fill="none" stroke="#abd200" stroke-width="5"/>
  <text x="400" y="110" text-anchor="middle" class="grande">22</text>
  <text x="400" y="164" text-anchor="middle" class="valor">Sequência atual</text>
  <text x="400" y="182" text-anchor="middle" class="menor">20 out – 10 nov</text>
</svg>
